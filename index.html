<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim Sense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lane-blue:#0b3d5c;
    --lane-blue-dark:#062a40;
    --pool-cyan:#2fb8c6;
    --lane-yellow:#f2c14e;
    --chalk:#f4f7f6;
    --ink:#0c2230;
    --line:#d7e2e4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  header{
    background:linear-gradient(180deg,var(--lane-blue) 0%,var(--lane-blue-dark) 100%);
    color:var(--chalk);
    padding:3rem 1.5rem 2.6rem;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  header::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:6px;
    background:repeating-linear-gradient(90deg,var(--lane-yellow) 0 24px,transparent 24px 40px);
    opacity:.85;
  }
  header h1{
    margin:0 0 .6rem;
    font-family:'Poppins',system-ui,sans-serif;
    font-weight:700;
    font-size:2.6rem;
    letter-spacing:.01em;
    max-width:640px;
    margin-left:auto;
    margin-right:auto;
  }
  header p{
    margin:0 auto;
    color:#bcd6e3;
    max-width:520px;
    line-height:1.5;
    font-size:1rem;
  }
  main{
    max-width:760px;
    margin:-1.4rem auto 3rem;
    padding:0 1.5rem;
    position:relative;
    z-index:1;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:1.5rem;
    margin-bottom:1.25rem;
    box-shadow:0 1px 2px rgba(12,34,48,.04);
  }
  .card h2{
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--lane-blue);
    margin:0 0 1rem;
    display:flex;
    align-items:center;
    gap:.5rem;
  }
  .resource-list{
    display:flex;
    flex-direction:column;
    gap:.75rem;
  }
  .resource-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    text-decoration:none;
    color:var(--ink);
    background:#f7fafa;
    border:1px solid var(--line);
    border-radius:8px;
    padding:1rem 1.1rem;
    transition:border-color .15s, background .15s;
  }
  .resource-link:hover{
    border-color:var(--pool-cyan);
    background:#f0fbfc;
  }
  .resource-link .label{
    font-weight:700;
    font-size:1.02rem;
  }
  .resource-link .desc{
    display:block;
    font-weight:400;
    font-size:.85rem;
    color:#5b7280;
    margin-top:.2rem;
  }
  .resource-link .arrow{
    color:var(--pool-cyan);
    font-size:1.2rem;
    flex-shrink:0;
  }
</style>
</head>
<body>

<header>
  <h1>Swim Sense</h1>
  <p>Tools to help swim teams get more out of their meets — starting with making heat sheets easier to read at a glance.</p>
</header>

<main>
  <div class="card">
    <h2>Resources</h2>
    <div class="resource-list">
      <a class="resource-link" href="highlighter.html">
        <span>
          <span class="label">Highlighter</span>
          <span class="desc">Upload a heat sheet PDF and highlight your swimmers or teams automatically.</span>
        </span>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </div>
</main>

</body>
</html>
